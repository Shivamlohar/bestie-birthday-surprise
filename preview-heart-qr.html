<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart-Shaped QR Code for Manvi ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 30px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1f1035 0%, #070614 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .heart-preview {
      width: 100%;
      max-width: 480px;
      height: auto;
      filter: drop-shadow(0 20px 50px rgba(255, 71, 87, 0.4));
      border-radius: 24px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 117, 140, 0.35);
      transition: all 0.2s ease;
    }
    .btn-pink {
      background: linear-gradient(135deg, #ff758c 0%, #ff4757 100%);
      color: #ffffff;
    }
    .btn-white {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      color: #ffd32a;
      border: 1px solid rgba(255, 211, 42, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1 style="font-size: 2rem; margin: 0; color: #ffd32a;">Heart-Shaped QR Code ❤️✨</h1>
    <p style="margin: 0; color: #c4b5fd; font-size: 1rem;">
      Specially made for <strong>Manvi</strong> (27 September)
    </p>

    <!-- Display the Heart-Shaped SVG QR Code -->
    <img src="manvi-heart-qr.svg" alt="Heart Shaped QR Code for Manvi" class="heart-preview" id="heart-qr-img">

    <div class="actions">
      <a href="manvi-heart-qr.svg" download="Manvi-Heart-QR.svg" class="btn btn-pink">
        📥 Download Heart QR (SVG)
      </a>
      <button id="download-png-btn" class="btn btn-white">
        📥 Download as PNG Image
      </button>
      <button onclick="window.print()" class="btn btn-white">
        🖨️ Print Heart QR
      </button>
    </div>

    <p style="margin-top: 10px; font-size: 0.85rem; color: #94a3b8;">
      Scans instantly from any iPhone or Android camera to open Manvi's birthday universe!
    </p>
  </div>

  <canvas id="export-canvas" style="display: none;"></canvas>

  <script>
    // 1-Click PNG Exporter
    document.getElementById('download-png-btn').addEventListener('click', () => {
      const img = document.getElementById('heart-qr-img');
      const canvas = document.getElementById('export-canvas');
      canvas.width = 1440; // ultra high-res 2x
      canvas.height = 1500;
      const ctx = canvas.getContext('2d');

      const tempImg = new Image();
      tempImg.crossOrigin = 'anonymous';
      tempImg.onload = () => {
        ctx.drawImage(tempImg, 0, 0, 1440, 1500);
        const a = document.createElement('a');
        a.download = 'Manvi-Heart-QR-Card.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      tempImg.src = 'manvi-heart-qr.svg';
    });
  </script>
</body>
</html>
