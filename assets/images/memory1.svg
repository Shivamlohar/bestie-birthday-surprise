<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed6e3"/>
      <stop offset="50%" stop-color="#fbc2eb"/>
      <stop offset="100%" stop-color="#a6c1ee"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fab1a0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad1)" rx="24"/>

  <!-- Sun / Golden Hour glow -->
  <circle cx="300" cy="260" r="130" fill="url(#sunGrad)" opacity="0.85" filter="url(#softGlow)"/>

  <!-- Floating soft clouds / hills -->
  <path d="M-20 480 C 120 420, 240 500, 360 450 C 460 410, 540 460, 620 440 L620 620 L-20 620 Z" fill="#ffffff" opacity="0.45"/>
  <path d="M-20 520 C 140 480, 280 540, 420 500 C 500 480, 560 520, 620 510 L620 620 L-20 620 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Two best friends silhouette on hill looking at sunset -->
  <g transform="translate(255, 360)">
    <!-- Friend 1 -->
    <circle cx="20" cy="18" r="14" fill="#6c5ce7"/>
    <path d="M6 34 C 6 25, 34 25, 34 34 L38 65 L2 65 Z" fill="#6c5ce7"/>
    
    <!-- Friend 2 -->
    <circle cx="58" cy="22" r="13" fill="#fd79a8"/>
    <path d="M45 37 C 45 28, 71 28, 71 37 L75 65 L41 65 Z" fill="#fd79a8"/>

    <!-- Linked arms / hands -->
    <path d="M28 42 Q 39 48, 50 42" stroke="#6c5ce7" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sparkles & floating hearts -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M140 180 Q 150 180, 150 170 Q 150 180, 160 180 Q 150 180, 150 190 Q 150 180, 140 180 Z"/>
    <path d="M450 150 Q 460 150, 460 140 Q 460 150, 470 150 Q 460 150, 460 160 Q 460 150, 450 150 Z"/>
    <path d="M420 280 Q 426 280, 426 274 Q 426 280, 432 280 Q 426 280, 426 286 Q 426 280, 420 280 Z"/>
  </g>

  <!-- Floating heart -->
  <path d="M295 185 C 290 170, 270 170, 270 185 C 270 200, 295 215, 295 215 C 295 215, 320 200, 320 185 C 320 170, 300 170, 295 185 Z" fill="#ff7675" opacity="0.85"/>
</svg>
